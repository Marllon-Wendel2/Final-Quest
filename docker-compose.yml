version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: final-quest-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: final-quest-api

    depends_on:
      - postgres

    ports:
      - "3001:3001"

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      DATABASE_URL: ${DATABASE_URL}

  frontend:
    build:
      context: ./frontend

    container_name: final-quest-web

    depends_on:
      - backend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001

volumes:
  postgres_data: